
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pivot Path Painting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rotating Arrow Game</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

<div id="controls-layout">

    <div id="controls">
        <h2>Controls</h2>

        <div class="control-section">
            <h3>Arrow 1 — Cyan</h3>
            <p><kbd>W</kbd> / <kbd>↑</kbd> Counterclockwise</p>
            <p><kbd>S</kbd> / <kbd>↓</kbd> Clockwise</p>
        </div>

        <div class="control-section">
            <h3>Arrow 2 — Orange</h3>
            <p><kbd>A</kbd> / <kbd>←</kbd> Counterclockwise</p>
            <p><kbd>D</kbd> / <kbd>→</kbd> Clockwise</p>
            <p>Scroll the mouse wheel over the game to change length.</p>
        </div>

        <p><kbd>P</kbd> Pause / Resume</p>
    </div>

    <div id="speedPanel">
        <h2>Animation Settings</h2>
    </div>

</div>


    <script src="script.js"></script>
</body>
</html>
